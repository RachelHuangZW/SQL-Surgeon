[project]
name = "sql-surgeon"
version = "0.1.0"
description = "LangGraph agent that diagnoses slow PostgreSQL queries from EXPLAIN ANALYZE, with a hardened read-only DB client"
requires-python = ">=3.10"
# Library dependencies only. The web API (fastapi/uvicorn) lives in backend/api and is not part of the package.
dependencies = [
    "psycopg2-binary>=2.9.0",
    "python-dotenv>=1.0.0",
    "langchain-google-genai>=2.0.0",
    "langchain-core>=0.3.0",
    "langgraph>=0.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sql_surgeon"]
